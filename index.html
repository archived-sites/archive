<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>archive.</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #fdfdfd;
            --text: #1a1a1a;
            --subtle: #999;
            --btn-white: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .hero {
            margin-top: 20vh;
            margin-bottom: 5vh;
            text-align: center;
        }

        .hero h1 {
            font-weight: 100;
            font-size: 4.5rem;
            letter-spacing: 6px;
            text-transform: lowercase;
            /* Soft white lightning glow */
            text-shadow: 0 0 15px #fff, 0 0 30px #fff;
            animation: breathe 4s infinite ease-in-out;
        }

        .links-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }

        .btn-main {
            background: var(--btn-white);
            padding: 22px;
            border-radius: 50px;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: var(--shadow);
            font-weight: 400;
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--text);
            user-select: none;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            letter-spacing: 1px;
        }

        .version-area {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .version-area.active {
            max-height: 200px;
            opacity: 1;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .btn-sm {
            background: var(--btn-white);
            padding: 10px 24px; 
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 300;
            color: var(--subtle);
            border: 1px solid rgba(0,0,0,0.02);
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-sm:hover {
            color: var(--text);
            border-color: rgba(0,0,0,0.1);
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.4;
            margin-bottom: 5px;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        #soft-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="soft-glow"></div>

    <header class="hero">
        <h1>archive.</h1>
<p><small>made by tld_david @tiktok</small></p>
    </header>

        <div class="group">
            <div class="btn-main" onclick="toggle('cine')">Cine Versions</div>
            <div class="version-area" id="cine">
                <span class="label">Available Versions</span>
                <a href="https://archived-sites.github.io/archive/cineos/v2.0-beta.html" class="btn-sm">v2.0 beta</a>
                <a href="https://archived-sites.github.io/archive/cineos/1.75.html" class="btn-sm">v1.75</a>
                <a href="https://archived-sites.github.io/archive/cineos/cinehubmodded" class="btn-sm">Cine Hub Modded V3.1</a>
            </div>
        </div>

        <div class="group">
            <div class="btn-main" onclick="toggle('gnos')">GN-OS</div>
            <div class="version-area" id="gnos">
                <span class="label">Available Versions</span>
                <a href="https://archived-sites.github.io/archive/gnos/gnos" class="btn-sm">v32.0</a>
            </div>
        </div>
    </main>

    <script>
        function toggle(id) {
            document.getElementById(id).classList.toggle('active');
        }

        const glow = document.getElementById('soft-glow');
        document.addEventListener('mousemove', (e) => {
            requestAnimationFrame(() => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            });
        });

        const title = document.querySelector('h1');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / 100;
            const y = (e.clientY - window.innerHeight / 2) / 100;
            title.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
